# plymouth-quit.service finishes once plymouthd acknowledges the quit request,
# but the daemon lingers briefly while releasing DRM master. On fast boots SDDM
# autologin then launches sway while plymouthd still holds the GPU, and wlroots
# aborts with "Could not take device: Device or resource busy" -> black screen.
# Wait (up to 10s) for plymouthd to fully exit before starting SDDM.
[Service]
ExecStartPre=-/bin/bash -c 'for (( i = 0; i < 100; i++ )); do if ! pgrep -x plymouthd > /dev/null; then break; fi; sleep 0.1; done'
