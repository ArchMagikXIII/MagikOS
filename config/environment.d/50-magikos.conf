# Session-wide Magikos install root. uwsm overrides this on setups that use
# it; everywhere else (plain sway from a tty, systemd user services such as
# magikos-restart-shell) this is what makes $MAGIKOS_PATH resolve.
MAGIKOS_PATH=/usr/share/magikos

# Sway probes every DRM device at startup and flags NVIDIA's proprietary
# driver even when the compositor renders on the AMD/Intel iGPU (NVIDIA is
# offloaded for gaming via prime-run). Magikos supports that layout, so opt
# out of the startup advisory. Inert when no proprietary GPU is present.
SWAY_UNSUPPORTED_GPU=true
