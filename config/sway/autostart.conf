# ==============================================================================
# MagikOS Autostart
# ==============================================================================

# Adaptive tiling: auto side-by-side / stacked based on window size
exec ~/.venvs/autotiling/bin/autotiling

# --- Bar: QuickShell (default) or Waybar (uncomment to switch) ---
# To switch back to Waybar: comment out the quickshell line below, uncomment waybar
# Resolve MAGIKOS_PATH inside bash so the fallback applies before any other
# expansion; sway would otherwise expand $MAGIKOS_PATH from its own (possibly
# empty) environment. Output is kept in ~/.local/state/magikos/quickshell.log
# so a bar that fails to come up can always be diagnosed after the fact.
exec_always bash -c 'export MAGIKOS_PATH="${MAGIKOS_PATH:-/usr/share/magikos}"; export PATH="$MAGIKOS_PATH/bin:$HOME/.local/bin:$PATH"; mkdir -p "$HOME/.local/state/magikos"; { systemctl --user import-environment MAGIKOS_PATH PATH 2>/dev/null; systemctl --user restart wayland-wm-app-daemon.service 2>/dev/null; exec /usr/bin/quickshell -p "$MAGIKOS_PATH/shell"; } >>"$HOME/.local/state/magikos/quickshell.log" 2>&1'

exec_always /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
