# ==============================================================================
# MagikOS Autostart
# ==============================================================================

# Adaptive tiling: auto side-by-side / stacked based on window size
exec autotiling

# --- Bar: QuickShell (default) or Waybar (run magikos-select-bar to switch) ---
exec_always MAGIKOS_PATH="$MAGIKOS_PATH" PATH="$MAGIKOS_PATH/bin:$HOME/.local/bin:$PATH" /usr/bin/quickshell -p "$MAGIKOS_PATH/shell" &
# exec_always   waybar&

exec_always /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
