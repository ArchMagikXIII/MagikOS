# Alacritty config (ported from Omarchy, Osaka-Jade theme baked in).

[env]
TERM = "xterm-256color"

[terminal]
osc52 = "CopyPaste"

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size = 8

[window]
padding.x = 14
padding.y = 14
decorations = "None"

[keyboard]
bindings = [
{ key = "Insert", mods = "Shift", action = "Paste" },
{ key = "Insert", mods = "Control", action = "Copy" },
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return without treating it as Alt+Return.
{ key = "Return", mods = "Shift", chars = "\u001B[13;2u" },
# Legacy encoding sends Alt+Shift+Return the same as Alt+Return; send CSI-u so tmux can match M-S-Enter.
{ key = "Return", mods = "Alt|Shift", chars = "\u001B[13;4u" }
]

[colors.primary]
background = "#111c18"
foreground = "#C1C497"

[colors.cursor]
text = "#111c18"
cursor = "#F7E8B2"

[colors.vi_mode_cursor]
text = "#111c18"
cursor = "#F7E8B2"

[colors.search.matches]
foreground = "#111c18"
background = "#459451"

[colors.search.focused_match]
foreground = "#111c18"
background = "#FF5345"

[colors.footer_bar]
foreground = "#111c18"
background = "#C1C497"

[colors.selection]
text = "#F7E8B2"
background = "#32473B"

[colors.normal]
black = "#111c18"
red = "#FF5345"
green = "#549e6a"
yellow = "#459451"
blue = "#509475"
magenta = "#D2689C"
cyan = "#2DD5B7"
white = "#C1C497"

[colors.bright]
black = "#53685B"
red = "#db9f9c"
green = "#63b07a"
yellow = "#E5C736"
blue = "#ACD4CF"
magenta = "#75bbb3"
cyan = "#8CD3CB"
white = "#F7E8B2"
