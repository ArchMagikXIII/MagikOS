[main]
term=xterm-256color
# Fedora's jetbrains-mono-fonts ships the plain "JetBrains Mono" family, so
# keep it as a fallback for systems without the Nerd variant; without this
# foot substitutes a non-monospace font and warns.
font=JetBrainsMono Nerd Font:size=8, JetBrains Mono:size=8
pad=14x14
initial-window-mode=windowed
workers=0

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return

[colors-dark]
foreground=C1C497
background=111c18
selection-foreground=F7E8B2
selection-background=32473B

cursor=111c18 F7E8B2

regular0=111c18
regular1=FF5345
regular2=549e6a
regular3=459451
regular4=509475
regular5=D2689C
regular6=2DD5B7
regular7=C1C497

bright0=53685B
bright1=db9f9c
bright2=63b07a
bright3=E5C736
bright4=ACD4CF
bright5=75bbb3
bright6=8CD3CB
bright7=F7E8B2
