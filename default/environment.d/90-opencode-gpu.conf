# Auto-configure opencode for GPU acceleration on compatible systems
# This file will be included in system-wide environment during installation

# Enable ROCm GPU support 
export ROCR_VISIBLE_DEVICES=all

# For AMD Radeon GPUs with gfx1031 (like RX 6700 XT, RX 7000 series)
# The override version for newer AMD hardware
export HSA_OVERRIDE_GFX_VERSION=10.3.1

# For Intel GPUs with Vulkan support
export GGML_VK_VISIBLE_DEVICES=all