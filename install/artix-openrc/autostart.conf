# Artix OpenRC Sway session; run once per login, not on every Sway reload.
exec dbus-update-activation-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE DBUS_SESSION_BUS_ADDRESS MAGIKOS_PATH PATH
exec bash -c 'mkdir -p "$HOME/.local/state/magikos"; magikos-openrc-user-services >>"$HOME/.local/state/magikos/openrc-services.log" 2>&1'
exec bash -c 'mkdir -p "$HOME/.local/state/magikos"; exec magikos-system-sleep-monitor >>"$HOME/.local/state/magikos/sleep-monitor.log" 2>&1'
exec bash -c 'mkdir -p "$HOME/.local/state/magikos"; exec /usr/bin/quickshell -p "$MAGIKOS_PATH/shell" >>"$HOME/.local/state/magikos/quickshell.log" 2>&1'
